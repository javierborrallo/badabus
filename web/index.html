<!doctype html>
<html lang="es" data-theme="claro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B2A4A">
  <meta name="description" content="Tiempos en directo, paradas, líneas y rutas del bus urbano de Badajoz.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>badabus</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <script>
    (function () {
      var tema = "claro";
      try {
        var g = localStorage.getItem("tema");
        tema = (g === "claro" || g === "oscuro")
          ? g
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro");
      } catch (e) {}
      document.documentElement.dataset.theme = tema;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", tema === "oscuro" ? "#0E233A" : "#0B2A4A");
      var idioma = "es";
      try {
        var gi = localStorage.getItem("idioma");
        idioma = (gi === "es" || gi === "en")
          ? gi
          : (String(navigator.language || "es").toLowerCase().startsWith("en") ? "en" : "es");
      } catch (e) {}
      document.documentElement.lang = idioma;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Afacad+Flux:wght@600;700&family=Instrument+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="shell">
    <div id="offline-bar" class="offline-bar" role="status" hidden></div>

    <!-- Top App Header -->
    <header class="topbar">
      <div class="topbar-inner">
        <button type="button" id="btn-brand" class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg width="26" height="26" viewBox="0 0 28 28" fill="none">
              <path d="M3.5 9.5v3.5M24.5 9.5v3.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
              <rect x="5.5" y="4" width="17" height="17" rx="4" stroke="currentColor" stroke-width="2"/>
              <rect x="9.5" y="6.2" width="9" height="2" rx="1" fill="#22C98E"/>
              <path d="M5.5 14.2h17" stroke="currentColor" stroke-width="1.8"/>
              <path d="M14 9.5v4.7" stroke="currentColor" stroke-width="1.3" opacity="0.45"/>
              <circle cx="9.2" cy="17.6" r="1.4" fill="currentColor"/>
              <circle cx="18.8" cy="17.6" r="1.4" fill="currentColor"/>
              <path d="M12.2 17.6h3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
              <path d="M8.5 21v2.5M19.5 21v2.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            </svg>
          </span>
          <span>badabus</span>
        </button>

        <nav class="desktop-nav" aria-label="Navegación principal">
          <button type="button" class="nav-link is-active" data-nav="inicio">Buscar</button>
          <button type="button" class="nav-link" data-nav="lineas">Líneas</button>
          <button type="button" class="nav-link" data-nav="paradas">Paradas</button>
          <button type="button" class="nav-link" data-nav="mapa">Mapa</button>
        </nav>

        <div class="top-utils">
          <span id="status-pill" class="status-pill" role="status">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="status-pill-text">Red normal</span>
          </span>
          <button type="button" id="btn-lang" class="util-btn" aria-label="Switch to English">EN</button>
          <button type="button" id="btn-theme" class="util-btn" aria-label="Cambiar tema">Oscuro</button>
        </div>
      </div>
    </header>

    <!-- Persistent Live Trip Bar -->
    <div id="trip-banner" class="trip-banner" role="status" hidden></div>

    <!-- Standard Pages (Buscar, Líneas, Paradas, Detalle ruta, En ruta) -->
    <main id="page-view" class="page-view"></main>

    <!-- Dedicated Map Tab -->
    <main id="map-view" class="map-view" aria-label="Mapa de rutas y paradas" hidden>
      <div class="map-page-inner">
        <div id="map-return-bar" class="map-return-bar" hidden></div>

        <section class="map-controls-top">
          <div class="field-wrap">
            <div class="map-search-box">
              <svg class="ico ico-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input id="map-search-input" type="search" autocomplete="off" placeholder="Buscar parada o línea…">
            </div>
            <div id="map-search-menu" class="ac-menu" hidden></div>
          </div>

          <div id="map-line-pills" class="line-pills-bar" role="group" aria-label="Filtrar líneas en el mapa"></div>
        </section>

        <div class="map-layout">
          <section class="map-frame" aria-label="Mapa urbano con paradas y rutas">
            <div id="map" class="map-canvas"></div>
            <div class="map-float-btns">
              <button type="button" id="btn-map-locate" class="map-circle-btn" aria-label="Centrar en mi ubicación">
                <svg class="ico ico-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg>
              </button>
              <button type="button" id="btn-map-nearest" class="map-circle-btn" aria-label="Parada más cercana">
                <svg class="ico ico-sm" viewBox="0 0 24 24" aria-hidden="true"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
              </button>
            </div>
          </section>

          <section id="map-stop-sheet" class="map-stop-sheet" aria-label="Llegadas en la parada seleccionada"></section>
        </div>
      </div>
    </main>

    <!-- Bottom Navigation Bar (Mobile < 720px): Buscar | Líneas | Paradas | Mapa -->
    <nav class="bottom-tabs" aria-label="Navegación móvil">
      <button type="button" class="btab is-active" data-nav="inicio">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span data-i18n="nav_inicio">Buscar</span>
      </button>
      <button type="button" class="btab" data-nav="lineas">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 11h16"/><path d="M8 17v2m8-2v2"/><circle cx="8" cy="14" r="1" fill="currentColor"/><circle cx="16" cy="14" r="1" fill="currentColor"/></svg>
        <span data-i18n="nav_lineas">Líneas</span>
      </button>
      <button type="button" class="btab" data-nav="paradas">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.3-6-10a6 6 0 1 1 12 0c0 4.7-6 10-6 10Z"/><circle cx="12" cy="11" r="2"/></svg>
        <span data-i18n="nav_paradas">Paradas</span>
      </button>
      <button type="button" class="btab" data-nav="mapa">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 6 6-2 6 2 6-2v14l-6 2-6-2-6 2V6Z"/><path d="M9 4v14M15 6v14"/></svg>
        <span data-i18n="nav_mapa">Mapa</span>
      </button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
